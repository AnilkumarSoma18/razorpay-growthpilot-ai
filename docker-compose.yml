version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: growthpilot-postgres
    environment:
      POSTGRES_USER: growthpilot
      POSTGRES_PASSWORD: growthpilot
      POSTGRES_DB: growthpilot
    ports:
      - "5432:5432"
    volumes:
      - growthpilot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: growthpilot-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: growthpilot-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: growthpilot-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  growthpilot_pg_data:
